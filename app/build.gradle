plugins {
    id 'com.android.application'
}

android {
    namespace 'com.box3d.quest'
    compileSdk 34
    // Pin the NDK for reproducible native builds (Android Studio will offer to
    // install this version if it isn't already present).
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.box3d.quest'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '1.0'

        // Quest 3 is arm64-only; building a single ABI keeps the APK small.
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // std::vector etc. require the shared C++ runtime.
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    // Required so the OpenXR loader AAR exposes its headers + library to CMake.
    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // OpenXR loader for Android (headers + libopenxr_loader.so via Prefab).
    // If Gradle cannot resolve this exact version, bump it to the latest
    // available on Maven Central (search "openxr_loader_for_android").
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.43'
}
