name: Build APK

# Builds the native Quest app on every push and pull request, and uploads the
# APK as a downloadable artifact.
#
# Two jobs it does:
#   1. Catches compile errors before anyone installs a headset build. The native
#      side pulls Box3D via FetchContent and the OpenXR loader from Maven, so a
#      pinned-revision bump can break the build in ways only a real compile finds.
#   2. Produces an APK you can download and `adb install` without needing
#      Android Studio locally.
#
# The artifact lands under the run's "Artifacts" section on the Actions tab.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pinned to match app/build.gradle's ndkVersion and the cmake version
      # declared in its externalNativeBuild block. Bump both together.
      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Box3D is fetched from source by CMake, so this cache saves a clone and a
      # full engine rebuild on every run.
      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: cxx-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: box3d-quest-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
