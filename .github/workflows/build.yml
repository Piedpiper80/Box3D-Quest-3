name: Build APK

# Two jobs:
#
#   apk   — builds the native Quest app and uploads the APK as a downloadable
#           artifact. Catches compile errors before anything reaches a headset,
#           and means installing a build needs only adb, not Android Studio.
#
#   bench — builds and runs the headless physics benchmark (see bench/bench.c)
#           across SIMD and worker-count configurations. Gives relative physics
#           scaling and regression detection without a device in the loop. It
#           cannot give absolute Quest numbers — CI hardware is far faster than
#           the XR2 Gen 2 and this measures no GPU cost at all.
#
# Artifacts land under the run's "Artifacts" section on the Actions tab.

on:
  # Branch pushes are covered by the pull_request trigger, so this only needs to
  # catch main directly — otherwise every PR branch builds twice per push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pinned to match app/build.gradle's ndkVersion and the cmake version
      # declared in its externalNativeBuild block. Bump both together.
      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Box3D is fetched from source by CMake, so this cache saves a clone and a
      # full engine rebuild on every run.
      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: cxx-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: box3d-quest-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  bench:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build benchmark (scalar)
        run: |
          cmake -S bench -B build/bench-scalar \
            -DCMAKE_BUILD_TYPE=Release -DBOX3D_DISABLE_SIMD=ON
          cmake --build build/bench-scalar --parallel

      - name: Build benchmark (SIMD)
        run: |
          cmake -S bench -B build/bench-simd \
            -DCMAKE_BUILD_TYPE=Release -DBOX3D_DISABLE_SIMD=OFF
          cmake --build build/bench-simd --parallel

      # Each configuration is a separate process so a crash in one doesn't hide
      # the others. Worker sweep shows where threading stops paying.
      - name: Run benchmark
        run: |
          echo "runner: $(nproc) cores"
          {
            echo "## config: scalar, 1 worker"
            ./build/bench-scalar/bench 1 3200
            echo "## config: simd, 1 worker"
            ./build/bench-simd/bench 1 3200
            echo "## config: simd, 2 workers"
            ./build/bench-simd/bench 2 3200
            echo "## config: simd, 4 workers"
            ./build/bench-simd/bench 4 3200
            echo "## phase 0.5: two heavyweight mechs colliding, simd, 4 workers"
            ./build/bench-simd/bench 4 0 mech
          } | tee bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.txt
          if-no-files-found: error
