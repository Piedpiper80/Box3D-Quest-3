name: Check

# Two jobs, and between them they prove everything a machine can prove about
# this project:
#
#   pages — runs the real page headlessly with a scripted pilot and checks it
#           draws and behaves. A page can crash on its first frame and look
#           exactly like a page that never loaded: black, no error. That
#           happened three times in a row here, which is why this exists.
#
#   wasm  — rebuilds docs/box3d.wasm from wasm/bridge.c against the pinned
#           Box3D revision, runs the engine suite against the fresh build, and
#           commits it back. The browser build is the only way to reach the
#           headset — no PC, no sideloading, no cable, just a URL — so the wasm
#           has to track bridge.c automatically rather than by hand.
#
# What neither can check is how any of it FEELS. That is the only thing that
# needs a person in a headset, and it is the only thing asked of one.

on:
  # Branch pushes are covered by the pull_request trigger, so this only needs
  # to catch main directly — otherwise every PR branch builds twice per push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Uses the committed wasm, so this catches page regressions even when the
      # engine has not been rebuilt.
      - name: Check the page draws and behaves
        run: node wasm/page-test.js arena.html

  wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Zig ships a complete C compiler and a wasm libc as a pip wheel, so no
      # separate toolchain install is needed. See wasm/build.md.
      - name: Install Zig
        run: pip install ziglang

      - name: Fetch Box3D
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/erincatto/box3d.git box3d-src
          cd box3d-src
          git checkout c52908c9a907714e4d3a8a30be5272a1761158e1

      - name: Build box3d.wasm
        run: |
          python3 -m ziglang cc -target wasm32-wasi -Oz -mexec-model=reactor \
            -DBOX3D_DISABLE_SIMD -DNDEBUG \
            -Ibox3d-src/include -Ibox3d-src/src \
            box3d-src/src/*.c wasm/bridge.c \
            -Wl,--strip-all -o docs/box3d.wasm
          ls -l docs/box3d.wasm

      # test.js loads box3d.wasm from its own directory, while the deployed
      # copy lives in docs/ for GitHub Pages. Give the harness the copy it
      # expects rather than teaching it a second path.
      - name: Run the engine suite against the fresh build
        run: |
          cp docs/box3d.wasm wasm/box3d.wasm
          node wasm/test.js
          # And against the page, so an engine change that leaves the headset
          # showing nothing is caught here rather than in a headset.
          node wasm/page-test.js arena.html

      - name: Commit the rebuilt wasm if it changed
        run: |
          if git diff --quiet -- docs/box3d.wasm; then
            echo "wasm unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/box3d.wasm
          # [skip ci] stops this commit from triggering another run of this
          # workflow, which would rebuild and commit forever.
          git commit -m "Rebuild box3d.wasm from bridge.c [skip ci]"

          # The branch often moves while this job is running, which left the
          # checkout stale and the push rejected. Rebase onto whatever landed
          # and retry; the wasm is a build product, so there is nothing to
          # conflict with except an older copy of itself.
          BRANCH="${{ github.head_ref || github.ref_name }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing and retrying"
            git fetch origin "$BRANCH"
            git rebase -X ours "origin/$BRANCH" || {
              git rebase --abort || true
              exit 1
            }
          done
          echo "could not push the rebuilt wasm after 3 attempts"
          exit 1

      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: box3d-wasm
          path: docs/box3d.wasm
          if-no-files-found: error
