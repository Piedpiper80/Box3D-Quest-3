name: Build APK

# Two jobs:
#
#   apk   — builds the native Quest app and uploads the APK as a downloadable
#           artifact. Catches compile errors before anything reaches a headset,
#           and means installing a build needs only adb, not Android Studio.
#
#   bench — builds and runs the headless physics benchmark (see bench/bench.c)
#           across SIMD and worker-count configurations. Gives relative physics
#           scaling and regression detection without a device in the loop. It
#           cannot give absolute Quest numbers — CI hardware is far faster than
#           the XR2 Gen 2 and this measures no GPU cost at all.
#
# Artifacts land under the run's "Artifacts" section on the Actions tab.

on:
  # Branch pushes are covered by the pull_request trigger, so this only needs to
  # catch main directly — otherwise every PR branch builds twice per push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pinned to match app/build.gradle's ndkVersion and the cmake version
      # declared in its externalNativeBuild block. Bump both together.
      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Box3D is fetched from source by CMake, so this cache saves a clone and a
      # full engine rebuild on every run.
      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: cxx-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: box3d-quest-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  bench:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build benchmark (scalar)
        run: |
          cmake -S bench -B build/bench-scalar \
            -DCMAKE_BUILD_TYPE=Release -DBOX3D_DISABLE_SIMD=ON
          cmake --build build/bench-scalar --parallel

      - name: Build benchmark (SIMD)
        run: |
          cmake -S bench -B build/bench-simd \
            -DCMAKE_BUILD_TYPE=Release -DBOX3D_DISABLE_SIMD=OFF
          cmake --build build/bench-simd --parallel

      # Each configuration is a separate process so a crash in one doesn't hide
      # the others. Worker sweep shows where threading stops paying.
      - name: Run benchmark
        run: |
          echo "runner: $(nproc) cores"
          {
            echo "## config: scalar, 1 worker"
            ./build/bench-scalar/bench 1 3200
            echo "## config: simd, 1 worker"
            ./build/bench-simd/bench 1 3200
            echo "## config: simd, 2 workers"
            ./build/bench-simd/bench 2 3200
            echo "## config: simd, 4 workers"
            ./build/bench-simd/bench 4 3200
            echo "## phase 0.5: two heavyweight mechs colliding, simd, 4 workers"
            ./build/bench-simd/bench 4 0 mech
          } | tee bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.txt
          if-no-files-found: error

  # Rebuilds docs/box3d.wasm from wasm/bridge.c and the pinned Box3D revision,
  # and commits it back. The browser build is the only way to measure Box3D on
  # real Quest hardware without a PC — no sideloading, no adb, no cable — so the
  # wasm has to track bridge.c automatically rather than by hand.
  wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Zig ships a complete C compiler and wasm libc as a pip wheel, so no
      # separate toolchain install is needed. See wasm/build.md.
      - name: Install Zig
        run: pip install ziglang

      # Must match the GIT_TAG in app/src/main/cpp/CMakeLists.txt and
      # bench/CMakeLists.txt, or the three builds measure different engines.
      - name: Fetch Box3D
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/erincatto/box3d.git box3d-src
          cd box3d-src
          git checkout c52908c9a907714e4d3a8a30be5272a1761158e1

      - name: Build box3d.wasm
        run: |
          python3 -m ziglang cc -target wasm32-wasi -Oz -mexec-model=reactor \
            -DBOX3D_DISABLE_SIMD -DNDEBUG \
            -Ibox3d-src/include -Ibox3d-src/src \
            box3d-src/src/*.c wasm/bridge.c \
            -Wl,--strip-all -o docs/box3d.wasm
          ls -l docs/box3d.wasm

      - name: Sanity-check the module
        run: node wasm/test.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/box3d.wasm; then
            echo "wasm unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/box3d.wasm
          # [skip ci] stops this commit from triggering another run of this
          # workflow, which would rebuild and commit forever.
          git commit -m "Rebuild box3d.wasm from bridge.c [skip ci]"
          git push

      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: box3d-wasm
          path: docs/box3d.wasm
          if-no-files-found: error
